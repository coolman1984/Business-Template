<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>مصنع الأنظمة</title>
    <script>
      // Applied before paint so there is no light/dark or RTL/LTR flash on load.
      (function () {
        try {
          // Only an explicit choice is stamped; otherwise the stylesheet follows the system setting.
          var theme = localStorage.getItem('bsf-theme');
          if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
          var locale = localStorage.getItem('bsf-locale') || 'ar';
          document.documentElement.setAttribute('lang', locale);
          document.documentElement.setAttribute('dir', locale === 'ar' ? 'rtl' : 'ltr');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
